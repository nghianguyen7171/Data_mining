<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc nghiệm Python căn bản — Buổi 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
            color: #111827;
            line-height: 1.6;
        }
        .question-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 2rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            min-height: 400px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .code-line {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #0f172a;
            color: #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            overflow-x: auto;
            margin: 0.75rem 0 0.25rem;
            white-space: pre;
        }
        .options-list {
            list-style-type: none;
            padding-left: 0;
            margin-top: 1.5rem;
            flex-grow: 1;
        }
        .option-item {
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-start;
            padding: 0.75rem 0.5rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s, opacity 0.2s;
            border: 1px solid transparent;
        }
        .option-item:hover:not(.disabled) {
            background-color: #f3f4f6;
            cursor: pointer;
        }
        .option-item.disabled {
            opacity: 0.7;
        }
        .option-input {
            margin-top: 0.3rem;
            margin-right: 0.75rem;
            cursor: inherit;
        }
        .option-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.95rem;
        }
        .correct-answer-box {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.375rem;
            font-size: 0.95rem;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section-title {
            color: #6b7280;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body class="p-4 md:p-10 flex items-center justify-center min-h-screen">
    <div class="max-w-3xl w-full mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-2xl font-bold text-gray-900 mb-1">Trắc nghiệm trong giờ học</h1>
            <h2 class="text-lg text-gray-600">Buổi 2 — Python căn bản &amp; NumPy tối thiểu</h2>
            <p class="text-sm text-gray-500 mt-2">Mỗi câu: một dòng lệnh → chọn kết quả đúng</p>
        </header>

        <main id="quiz-container"></main>

        <div id="summary-container" class="hidden text-center bg-white border border-gray-200 rounded-lg p-8 shadow-sm">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Hoàn thành bài thi!</h3>
            <p class="text-lg mb-6">Điểm số của bạn: <span id="final-score" class="font-bold text-blue-600 text-3xl">0/18</span></p>
            <div class="flex justify-center space-x-4">
                <button id="review-btn" class="px-6 py-2 bg-gray-200 text-gray-800 font-semibold rounded hover:bg-gray-300 transition duration-150">Xem lại đáp án</button>
                <button id="reset-btn" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition duration-150">Làm lại từ đầu</button>
            </div>
        </div>

        <div id="navigation-controls" class="mt-6 flex justify-between items-center">
            <button id="prev-btn" class="px-4 py-2 bg-gray-200 text-gray-700 font-medium rounded hover:bg-gray-300 transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Câu trước
            </button>

            <span id="progress-text" class="text-sm font-medium text-gray-500">1 / 18</span>

            <button id="next-btn" class="px-4 py-2 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                Câu tiếp &rarr;
            </button>
        </div>
    </div>

    <script>
        // Mỗi câu = một dòng code; học viên chọn kết quả đúng.
        // Giả định: import numpy as np (chỉ dùng ở phần NumPy).
        const rawQuizData = [
            {
                section: "Phần 1: Kiểu dữ liệu & cấu trúc",
                questions: [
                    {
                        code: "type(3.14)",
                        options: [
                            "<class 'float'>",
                            "<class 'int'>",
                            "<class 'str'>",
                            "<class 'number'>"
                        ],
                        correctAnswer: 0
                    },
                    {
                        code: "len(['Python', 'R', 'Java'])",
                        options: [
                            "2",
                            "3",
                            "4",
                            "['Python', 'R', 'Java']"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "('Sun', 6)[0]",
                        options: [
                            "6",
                            "('Sun',)",
                            "'Sun'",
                            "Error"
                        ],
                        correctAnswer: 2
                    },
                    {
                        code: "{'name': 'An', 'year': 2}['name']",
                        options: [
                            "'year'",
                            "2",
                            "Error",
                            "'An'"
                        ],
                        correctAnswer: 3
                    }
                ]
            },
            {
                section: "Phần 2: Indexing & Slicing (trọng tâm)",
                questions: [
                    {
                        code: "[10, 20, 30, 40, 50][0]",
                        options: [
                            "10",
                            "20",
                            "0",
                            "50"
                        ],
                        correctAnswer: 0
                    },
                    {
                        code: "[10, 20, 30, 40, 50][-1]",
                        options: [
                            "10",
                            "40",
                            "50",
                            "Error"
                        ],
                        correctAnswer: 2
                    },
                    {
                        code: "[10, 20, 30, 40, 50][1:3]",
                        options: [
                            "[10, 20, 30]",
                            "[20, 30]",
                            "[20, 30, 40]",
                            "[1, 3]"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "[10, 20, 30, 40, 50][:3]",
                        options: [
                            "[10, 20]",
                            "[30, 40, 50]",
                            "[10, 20, 30]",
                            "[10, 20, 30, 40]"
                        ],
                        correctAnswer: 2
                    },
                    {
                        code: "[10, 20, 30, 40, 50][2:]",
                        options: [
                            "[10, 20]",
                            "[30, 40, 50]",
                            "[20, 30, 40, 50]",
                            "[2, 3, 4]"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "[10, 20, 30, 40, 50][::2]",
                        options: [
                            "[10, 30, 50]",
                            "[20, 40]",
                            "[10, 20]",
                            "[50, 30, 10]"
                        ],
                        correctAnswer: 0
                    },
                    {
                        code: "[10, 20, 30, 40, 50][::-1]",
                        options: [
                            "[10, 20, 30, 40, 50]",
                            "[50, 40, 30, 20, 10]",
                            "[50]",
                            "[::-1]"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "'ANALYTICS'[:4]",
                        options: [
                            "'ANAL'",
                            "'ANLY'",
                            "'ANALY'",
                            "'YTICS'"
                        ],
                        correctAnswer: 0
                    }
                ]
            },
            {
                section: "Phần 3: NumPy tối thiểu",
                questions: [
                    {
                        code: "np.array([10, 20, 30, 40])[1:3]",
                        options: [
                            "array([10, 20, 30])",
                            "array([20, 30])",
                            "array([20, 30, 40])",
                            "[20, 30]"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "np.array([10, 20, 30]) * 2",
                        options: [
                            "array([10, 20, 30, 10, 20, 30])",
                            "array([12, 22, 32])",
                            "array([20, 40, 60])",
                            "Error"
                        ],
                        correctAnswer: 2
                    },
                    {
                        code: "np.array([[1, 2, 3], [4, 5, 6]])[0, 1]",
                        options: [
                            "1",
                            "4",
                            "3",
                            "2"
                        ],
                        correctAnswer: 3
                    },
                    {
                        code: "np.array([[1, 2], [3, 4]])[:, 0]",
                        options: [
                            "array([1, 3])",
                            "array([1, 2])",
                            "array([2, 4])",
                            "1"
                        ],
                        correctAnswer: 0
                    }
                ]
            },
            {
                section: "Phần 4: Hàm — nhận diện kết quả",
                questions: [
                    {
                        code: "(lambda x: x ** 2)(5)",
                        options: [
                            "10",
                            "25",
                            "32",
                            "Error"
                        ],
                        correctAnswer: 1
                    },
                    {
                        code: "sum([8, 9, 7]) / len([8, 9, 7])",
                        options: [
                            "24",
                            "3",
                            "8.0",
                            "8"
                        ],
                        correctAnswer: 2
                    }
                ]
            }
        ];

        let flatQuestions = [];
        rawQuizData.forEach((sectionData) => {
            sectionData.questions.forEach((q) => {
                flatQuestions.push({
                    sectionTitle: sectionData.section,
                    code: q.code,
                    options: q.options,
                    correctAnswer: q.correctAnswer,
                    userAnswer: null
                });
            });
        });

        const totalQuestions = flatQuestions.length;
        let currentIndex = 0;
        let isReviewMode = false;

        const container = document.getElementById('quiz-container');
        const summaryContainer = document.getElementById('summary-container');
        const navControls = document.getElementById('navigation-controls');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');
        const reviewBtn = document.getElementById('review-btn');
        const resetBtn = document.getElementById('reset-btn');
        const finalScoreSpan = document.getElementById('final-score');

        function renderQuestion(index) {
            container.innerHTML = '';

            const q = flatQuestions[index];
            const card = document.createElement('div');
            card.className = 'question-card';

            const sectionEl = document.createElement('h3');
            sectionEl.className = 'section-title';
            sectionEl.textContent = q.sectionTitle;
            card.appendChild(sectionEl);

            const prompt = document.createElement('p');
            prompt.className = 'font-semibold text-gray-800 text-lg mb-2';
            prompt.textContent = `Câu ${index + 1}: Kết quả của dòng lệnh sau là gì?`;
            card.appendChild(prompt);

            const codeEl = document.createElement('pre');
            codeEl.className = 'code-line';
            codeEl.textContent = q.code;
            card.appendChild(codeEl);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            const hasAnswered = q.userAnswer !== null;
            const shouldShowResult = hasAnswered || isReviewMode;

            q.options.forEach((opt, optIndex) => {
                const li = document.createElement('li');
                li.className = `option-item ${shouldShowResult ? 'disabled' : ''}`;

                const inputId = `opt-${optIndex}`;

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = 'question-radio';
                input.id = inputId;
                input.value = optIndex;
                input.className = 'option-input';

                if (q.userAnswer === optIndex) {
                    input.checked = true;
                }

                if (shouldShowResult) {
                    input.disabled = true;
                } else {
                    li.addEventListener('click', () => {
                        if (q.userAnswer === null && !isReviewMode) {
                            q.userAnswer = optIndex;
                            renderQuestion(currentIndex);
                        }
                    });
                }

                const label = document.createElement('label');
                label.htmlFor = inputId;
                label.className = `option-code text-gray-700 w-full ${shouldShowResult ? 'cursor-default' : 'cursor-pointer'}`;
                label.textContent = opt;

                if (shouldShowResult) {
                    if (optIndex === q.correctAnswer) {
                        li.classList.add('bg-green-50', 'border-green-200');
                        label.classList.add('text-green-800', 'font-bold');
                    } else if (q.userAnswer === optIndex && optIndex !== q.correctAnswer) {
                        li.classList.add('bg-red-50', 'border-red-200');
                        label.classList.add('text-red-700', 'line-through');
                    }
                }

                li.appendChild(input);
                li.appendChild(label);
                optionsList.appendChild(li);
            });

            card.appendChild(optionsList);

            if (shouldShowResult) {
                const answerBox = document.createElement('div');
                answerBox.className = 'correct-answer-box';
                answerBox.style.display = 'block';

                if (hasAnswered && q.userAnswer === q.correctAnswer) {
                    answerBox.classList.add('bg-green-100', 'border', 'border-green-300', 'text-green-800');
                    answerBox.innerHTML = `<strong>Chính xác!</strong> Bạn đã chọn đúng.`;
                } else if (hasAnswered && q.userAnswer !== q.correctAnswer) {
                    answerBox.classList.add('bg-red-100', 'border', 'border-red-300', 'text-red-800');
                    answerBox.innerHTML = `<strong>Chưa chính xác.</strong> Đáp án đúng là: <br/><span class="font-semibold option-code text-gray-900 mt-1 inline-block">${q.options[q.correctAnswer]}</span>`;
                } else {
                    answerBox.classList.add('bg-yellow-100', 'border', 'border-yellow-300', 'text-yellow-800');
                    answerBox.innerHTML = `<strong>Chưa trả lời.</strong> Đáp án đúng là: <br/><span class="font-semibold option-code text-gray-900 mt-1 inline-block">${q.options[q.correctAnswer]}</span>`;
                }
                card.appendChild(answerBox);
            }

            container.appendChild(card);
            updateNavigation();
        }

        function updateNavigation() {
            progressText.textContent = `${currentIndex + 1} / ${totalQuestions}`;

            prevBtn.disabled = currentIndex === 0;

            const q = flatQuestions[currentIndex];
            const hasAnswered = q.userAnswer !== null;

            if (currentIndex === totalQuestions - 1) {
                if (!isReviewMode) {
                    nextBtn.textContent = 'Nộp bài';
                    nextBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    nextBtn.classList.add('bg-green-600', 'hover:bg-green-700');
                    nextBtn.disabled = !hasAnswered;
                } else {
                    nextBtn.textContent = 'Kết thúc';
                    nextBtn.classList.remove('bg-green-600', 'hover:bg-green-700');
                    nextBtn.classList.add('bg-gray-600', 'hover:bg-gray-700');
                    nextBtn.disabled = false;
                }
            } else {
                nextBtn.innerHTML = 'Câu tiếp &rarr;';
                nextBtn.classList.remove('bg-green-600', 'hover:bg-green-700', 'bg-gray-600', 'hover:bg-gray-700');
                nextBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                nextBtn.disabled = (!isReviewMode && !hasAnswered);
            }
        }

        function calculateScore() {
            let score = 0;
            flatQuestions.forEach(q => {
                if (q.userAnswer === q.correctAnswer) score++;
            });
            return score;
        }

        function showSummary() {
            const score = calculateScore();
            container.style.display = 'none';
            navControls.style.display = 'none';
            summaryContainer.style.display = 'block';
            finalScoreSpan.textContent = `${score}/${totalQuestions}`;
        }

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            } else if (currentIndex === totalQuestions - 1) {
                showSummary();
            }
        });

        reviewBtn.addEventListener('click', () => {
            isReviewMode = true;
            summaryContainer.style.display = 'none';
            container.style.display = 'block';
            navControls.style.display = 'flex';
            currentIndex = 0;
            renderQuestion(currentIndex);
        });

        resetBtn.addEventListener('click', () => {
            isReviewMode = false;
            currentIndex = 0;
            flatQuestions.forEach(q => q.userAnswer = null);

            summaryContainer.style.display = 'none';
            container.style.display = 'block';
            navControls.style.display = 'flex';

            renderQuestion(currentIndex);
        });

        renderQuestion(currentIndex);
    </script>
</body>
</html>
