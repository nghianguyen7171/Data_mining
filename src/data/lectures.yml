# Course schedule — 15 weeks, alternating Lecture and Lab.
#
#   id     stable and permanent. Permalinks key off it. Never renumber.
#   week   may shift when the term moves. Renumber freely.
#   status released | draft | tbd
#            Only `released` emits links. A `tbd` week shows the title greyed
#            out with no dead links to last year's materials.

lectures:
  - id: 1
    week: 1
    type: "Lecture"
    title: "Introduction to Data Mining & CRISP-DM"
    status: released
    topics:
      - "What is data mining and why it matters for business decisions"
      - "Four problem types: Describe, Relate, Group, Predict"
      - "Data concepts: rows, columns, variable types, structured vs unstructured"
      - "The CRISP-DM six-stage process — the backbone of the course"
      - "Orange Data Mining overview and live demo"
      - "Quick pandas review: DataFrames, filtering, and descriptive statistics"
    clos: "1, 2"
    slides: "assets/materials/1.Intro_CRISP-DM.pdf"
    quiz: "assets/materials/1.Quiz_Intro_CRISP-DM.html"
    assignment: "lab0-setup"
    assessment: "Lab 0 submission"

  - id: 2
    week: 2
    type: "Lab"
    title: "Lab 2 — Python Basics & Minimal NumPy"
    status: released
    topics:
      - "Variables, lists, dicts, and None"
      - "Indexing & slicing on lists, strings, and NumPy arrays"
      - "Minimal NumPy: arrays, vectorization, np.nan"
      - "Submit notebook lab2_YourName.ipynb to the course Drive folder"
    clos: "2, 5, 6"
    slides: "assets/materials/2.Basic_Py.pdf"
    # quiz: "assets/materials/2.Quiz_Basic_Py.html"  # temporarily hidden
    # assignment: "lab2-python-basics"  # temporarily hidden
    assessment: "—"

